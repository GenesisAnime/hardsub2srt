<svg xmlns="http://www.w3.org/2000/svg" xml:lang="tr" lang="tr" role="img" aria-labelledby="title desc" viewBox="0 0 1120 560" font-family="Inter, Segoe UI, Arial, sans-serif" fill="#172033">
  <title id="title">Altyazı çıkarma akışı</title>
  <desc id="desc">Gömülü altyazı track'i varsa softsub yolu FFmpeg ile ilk track'i dışa aktarmayı dener. Track yoksa hardsub yolu OCR ile video karelerindeki yazıyı okur. Softsub codec veya container desteklenmezse işlem hata verir; OCR fallback yapılmaz. Hiçbir yol çeviri yapmaz.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
  </defs>
  <rect width="1120" height="560" rx="28" fill="#f8fafc"/>
  <text x="560" y="54" text-anchor="middle" font-size="28" font-weight="700">Videodaki altyazı nasıl SRT’ye çıkarılır?</text>
  <rect x="408" y="82" width="304" height="62" rx="16" fill="#e2e8f0"/>
  <text x="560" y="121" text-anchor="middle" font-size="22" font-weight="650">Video</text>
  <path class="line" d="M560 144V174"/>
  <rect x="300" y="183" width="520" height="76" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="560" y="216" text-anchor="middle" font-size="19" font-weight="650">FFprobe gömülü altyazı track’i buluyor mu?</text>
  <text x="560" y="242" text-anchor="middle" fill="#475569" font-size="15">İlk track kullanılır; track seçimi yoktur.</text>
  <path d="M430 259C380 287 300 288 270 320" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M690 259C740 287 820 288 850 320" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="326" y="294" font-size="16" font-weight="650" fill="#6d28d9">Evet · Softsub</text>
  <text x="765" y="294" font-size="16" font-weight="650" fill="#0369a1">Hayır · Hardsub</text>
  <rect x="54" y="326" width="482" height="184" rx="22" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="86" y="365" font-size="22" font-weight="750" fill="#6d28d9">Softsub</text>
  <text x="86" y="400" font-size="18">FFmpeg ilk track’i SRT’ye aktarmayı dener.</text>
  <rect x="82" y="423" width="426" height="62" rx="13" fill="#fff" stroke="#fca5a5" stroke-width="2"/>
  <text x="101" y="449" font-size="15" font-weight="700" fill="#b91c1c">Codec/container desteklenmiyorsa</text>
  <text x="101" y="471" font-size="15" fill="#7f1d1d">hata verir; OCR fallback yapılmaz.</text>
  <rect x="584" y="326" width="482" height="184" rx="22" fill="#eff6ff" stroke="#38bdf8" stroke-width="2"/>
  <text x="616" y="365" font-size="22" font-weight="750" fill="#0369a1">Hardsub</text>
  <text x="616" y="400" font-size="18">OCR, karelere işlenmiş yazıyı okur.</text>
  <rect x="612" y="423" width="426" height="62" rx="13" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
  <text x="825" y="462" text-anchor="middle" font-size="17" font-weight="650" fill="#1e3a8a">SRT üretir · Çeviri yapmaz</text>
  <text x="560" y="542" text-anchor="middle" fill="#475569" font-size="14">OCR yalnızca hardsub görüntü metnini okur; softsub mevcut altyazı metnini dışa aktarır.</text>
</svg>
